name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
          cache: true

      - name: Create Android project files
        run: flutter create --platforms=android --org com.rohitjagtap --project-name agri_spray_offline .

      - name: Fix default widget test
        run: |
          cat > test/widget_test.dart << 'EOF'
          import 'package:flutter_test/flutter_test.dart';

          import 'package:agri_spray_offline/main.dart';

          void main() {
            testWidgets('App builds and shows home page', (WidgetTester tester) async {
              await tester.pumpWidget(const AgriSprayOfflineApp());
              expect(find.byType(AgriSprayOfflineApp), findsOneWidget);
            });
          }
          EOF

      - name: Set Android SDK 35
        run: |
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/' android/app/build.gradle

          if grep -q "compileSdk = 35" android/app/build.gradle; then
            echo "compileSdk successfully set to 35"
          else
            echo "ERROR: compileSdk was not set to 35"
            exit 1
          fi

      - name: Set app name
        run: |
          sed -i 's/android:label="[^"]*"/android:label="FarmBook"/' android/app/src/main/AndroidManifest.xml

      - name: Verify main.dart
        run: |
          echo "Checking SelectedDripChemical..."
          grep -n -A20 "class SelectedDripChemical" lib/main.dart

          echo ""
          echo "Checking unit field..."
          if grep -q "final String unit;" lib/main.dart; then
            echo "SelectedDripChemical.unit FOUND"
          else
            echo "ERROR: SelectedDripChemical.unit is missing from lib/main.dart"
            exit 1
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: agri-spray-release-apk
          path: build/app/outputs/flutter-apk/*.apk
